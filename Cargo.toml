[workspace]
resolver = "2"
members = [
    "crates/automerge_repo",
    "crates/wobook-core",
    "crates/wobookd",
    "crates/wobook",
    "crates/wobook-sync",
    "crates/wobook-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
automerge-repo = { path = "crates/automerge_repo" }
wobook-core = { path = "crates/wobook-core" }
wobook-sync = { path = "crates/wobook-sync" }
anyhow = "1"
assert_cmd = "2"
async-trait = "0.1"
automerge = "=0.11.0"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
encoding_rs = "0.8"
fs2 = "0.4"
nucleo-matcher = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
