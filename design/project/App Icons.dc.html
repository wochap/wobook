<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/nocturne-53929d40-05df-499c-bc14-17884e999fc5/styles.css">
<script src="_ds/nocturne-53929d40-05df-499c-bc14-17884e999fc5/_ds_bundle.js"></script>
<link rel="stylesheet" href="wobook-tokens.css">
<style>body{margin:0;background:#11111b;font-family:Inter,sans-serif}a{color:#89b4fa}a:hover{color:#b4befe}</style>
</helmet>
<section data-theme="dark" style="padding:48px;display:flex;flex-direction:column;gap:24px;background:var(--wb-bg-lowest);min-height:100vh;box-sizing:border-box">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:28px;font-weight:500;color:var(--wb-text)">wobook — app icon</div>
<div style="font-size:14px;color:var(--wb-text-muted)">Android adaptive, 108dp canvas, circle mask. Large, launcher 48, notification 24 and Latte. Chosen: Synced pair.</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:20px">

<sc-for list="{{ options }}" as="o" hint-placeholder-count="1">
<div id="{{ o.id }}" style="width:300px;padding:20px;border-radius:20px;background:var(--wb-bg);box-shadow:var(--wb-shadow-1);display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;gap:10px">
<span style="font:500 12px/16px 'JetBrains Mono',monospace;color:var(--wb-accent);border:1px solid var(--wb-accent);border-radius:4px;padding:2px 6px">{{ o.id }}</span>
<span style="font-size:16px;font-weight:500;color:var(--wb-text)">{{ o.name }}</span>
</div>
<div style="display:flex;justify-content:center;padding:8px 0">
<div style="width:176px;height:176px;border-radius:50%;overflow:hidden;box-shadow:var(--wb-shadow-2)">
<svg viewBox="0 0 108 108" width="176" height="176" style="display:block">
<rect width="108" height="108" style="fill:var(--ctp-mantle)"></rect>
<g dangerouslySetInnerHTML="{{ o.html }}"></g>
</svg>
</div>
</div>
<div style="display:flex;align-items:flex-end;gap:16px">
<div style="width:48px;height:48px;border-radius:50%;overflow:hidden"><svg viewBox="0 0 108 108" width="48" height="48" style="display:block"><rect width="108" height="108" style="fill:var(--ctp-mantle)"></rect><g dangerouslySetInnerHTML="{{ o.html }}"></g></svg></div>
<svg viewBox="18 18 72 72" width="24" height="24" style="display:block"><g dangerouslySetInnerHTML="{{ o.html }}"></g></svg>
<div data-theme="light" style="display:flex;gap:12px;align-items:flex-end;margin-left:auto;padding:8px;border-radius:12px;background:var(--wb-bg)">
<div style="width:48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:var(--wb-shadow-2)"><svg viewBox="0 0 108 108" width="48" height="48" style="display:block"><rect width="108" height="108" style="fill:var(--ctp-base)"></rect><g dangerouslySetInnerHTML="{{ o.html }}"></g></svg></div>
<svg viewBox="18 18 72 72" width="24" height="24" style="display:block"><g dangerouslySetInnerHTML="{{ o.html }}"></g></svg>
</div>
</div>
<div style="font-size:13px;line-height:18px;color:var(--wb-text-muted);text-wrap:pretty">{{ o.note }}</div>
</div>
</sc-for>

</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const s = 'fill="none" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--ctp-blue)"';
    const mk = h => ({ __html: h });
    return { options: [
      { id: '1d', name: 'Synced pair', note: 'Two ribbons offset — your bookmarks on phone and desktop, kept in step.',
        html: mk(`<path d="M46 22H74V72L60 61L46 72Z" stroke-width="4.5" fill="none" stroke-linejoin="round" style="stroke:var(--ctp-lavender);opacity:.7"/><path d="M34 34H62V86L48 75L34 86Z" stroke-width="5" stroke-linejoin="round" style="stroke:var(--ctp-blue);fill:var(--ctp-mantle)"/>`) }
    ]};
  }
}
</script>
</body>
</html>
