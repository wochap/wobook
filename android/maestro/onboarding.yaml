# Fresh install: name the device, start fresh, land on the empty Home.
appId: dev.wochap.wobook
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: "onb-1" }
    timeout: 30000
- tapOn: { id: "onb-name" }
- eraseText: 80
- eraseText: 80
- inputText: "e2e-phone"
- tapOn: { id: "onb-continue" }
- assertVisible: { id: "onb-2" }
- extendedWaitUntil:
    visible: "Named .*e2e-phone.*"
    timeout: 5000
- tapOn: { id: "onb-fresh" }
- extendedWaitUntil:
    visible: { id: "home-empty" }
    timeout: 10000
- assertVisible: "No bookmarks yet"
- assertVisible: { id: "empty-scan" }
- assertVisible: { id: "empty-show" }
